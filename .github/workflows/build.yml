name: 构建落格Loge·灵动岛

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

# 标签推送时要创建 Release 并上传 deb，需要 contents: write
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 roothide Theos
        run: |
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          # install-theos 里 SDK 下载走匿名 GitHub API，容易被限流（ERROR: api.github.com request failed）
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)" || echo "install-theos 部分失败（通常只是 SDK 下载被限流），继续手动补装"
          # 用认证 token 手动补装 SDK，绕开匿名限流
          if ! ls "$THEOS/sdks/" 2>/dev/null | grep -q "iPhoneOS16.5.sdk"; then
            mkdir -p "$THEOS/sdks"
            URL=$(curl -fsSL -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/theos/sdks/releases/latest" | grep -o 'https://[^"]*iPhoneOS16.5.sdk.tar.xz' | head -1)
            echo "下载 SDK: $URL"
            curl -fsSL "$URL" -o /tmp/sdk.tar.xz
            tar -xJf /tmp/sdk.tar.xz -C "$THEOS/sdks/"
          fi
          echo "=== 已安装的 SDK ===" && ls "$THEOS/sdks/"

      - name: 编译打包
        run: |
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          command -v ldid >/dev/null 2>&1 || brew install ldid || true
          make clean
          make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1

      - name: 产物清单
        run: |
          echo "=== 生成的 deb ==="
          find . -name '*.deb' -type f -print
          echo "=== 包信息 ==="
          if command -v dpkg-deb >/dev/null 2>&1; then
            find . -name '*.deb' -type f -exec sh -c 'dpkg-deb -I "$1" | grep -E "Package|Version|Architecture"' _ {} \;
          else
            # macOS runner 没有 dpkg-deb，退回 ar + tar 读 control
            find . -name '*.deb' -type f | while read -r deb; do
              tmp="$(mktemp -d)"
              ( cd "$tmp" && ar x "$OLDPWD/$deb" control.tar.gz && tar xzf control.tar.gz )
              grep -E "^(Package|Version|Architecture):" "$tmp/control"
              rm -rf "$tmp"
            done
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 落格Loge-灵动岛-deb
          path: "**/*.deb"
          if-no-files-found: error

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "**/*.deb"
          generate_release_notes: true
